name: Send Daily Research Newsletter

on:
  push:
    branches: [main]
    paths:
      - 'outputs/reports/**.md'

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest report
        id: report
        run: |
          LATEST=$(ls outputs/reports/*.md 2>/dev/null | grep -v '.gitkeep' | sort | tail -1)
          if [ -z "$LATEST" ]; then
            echo "No report found, skipping."
            echo "file=" >> $GITHUB_OUTPUT
            exit 0
          fi
          DATE=$(basename "$LATEST" .md)
          echo "file=$LATEST" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Send email
        if: steps.report.outputs.file != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: acn.kazuma.kato@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "【自動車リサーチ】Daily Newsletter ${{ steps.report.outputs.date }}"
          to: kazuma.kato@accenture.com
          from: "Auto Research Agent <acn.kazuma.kato@gmail.com>"
          convert_markdown: true
          body: file://${{ steps.report.outputs.file }}
